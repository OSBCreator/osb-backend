<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSB — You're Offline</title>
<link rel="icon" href="/osb-emblem.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07070E;color:#ECECF2;font-family:'Figtree',system-ui,sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center}
.wrap{max-width:420px}
img{height:64px;margin-bottom:1.5rem;opacity:.9}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:2rem;font-weight:600;margin-bottom:.75rem}
p{color:rgba(255,255,255,.55);line-height:1.7;margin-bottom:1.75rem;font-size:.95rem}
button{background:#C1121F;color:#fff;border:none;border-radius:10px;padding:.85rem 1.75rem;
  font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;
  cursor:pointer;font-weight:600}
button:hover{background:#d81b28}
.note{margin-top:1.5rem;font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:1px;
  color:rgba(255,255,255,.3);text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <img src="/osb-emblem.png" alt="OSB">
  <h1>You're offline.</h1>
  <p>This page needs a connection to load. Once you're back online, OSB will work as normal — nothing you were doing has been lost.</p>
  <button onclick="location.reload()">Try again</button>
  <div class="note">OSB — installed app</div>
</div>
</body>
</html>
